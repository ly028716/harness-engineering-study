<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1160" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#F4ECDF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFAF2"/>
      <stop offset="1" stop-color="#FFFDF9"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#201C19"/>
      <stop offset="1" stop-color="#171412"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1360" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#493421" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="170" cy="90" r="160" fill="#B8562F" fill-opacity="0.10"/>
  <circle cx="1080" cy="110" r="140" fill="#2F6C54" fill-opacity="0.09"/>

  <g filter="url(#shadow)">
    <rect x="56" y="48" width="1168" height="624" rx="32" fill="#FFFBF5" fill-opacity="0.82" stroke="#D8C3AD"/>
  </g>

  <rect x="88" y="80" width="276" height="38" rx="19" fill="#EFD5C8"/>
  <circle cx="108" cy="99" r="5" fill="#B8562F"/>
  <text x="126" y="104" fill="#7A3218" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="1.2">README HERO PREVIEW</text>

  <text x="88" y="176" fill="#1F2B33" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">
    <tspan x="88" dy="0">A lightweight Agent Harness</tspan>
    <tspan x="88" dy="66">for structured engineering workflows</tspan>
  </text>

  <text x="88" y="286" fill="#59656F" font-family="Georgia, 'Times New Roman', serif" font-size="24">
    <tspan x="88" dy="0">From task input to verdict output through a readable</tspan>
    <tspan x="88" dy="34">Plan - Work - Review loop.</tspan>
  </text>

  <rect x="88" y="332" width="230" height="54" rx="27" fill="#B8562F"/>
  <text x="145" y="366" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700">Open MVP Docs</text>

  <rect x="334" y="332" width="230" height="54" rx="27" fill="#FFF8F0" stroke="#D8C3AD"/>
  <text x="449" y="366" fill="#1F2B33" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Read the Research</text>

  <rect x="88" y="408" width="266" height="204" rx="24" fill="url(#card)" stroke="#D8C3AD"/>
  <rect x="112" y="432" width="126" height="28" rx="14" fill="#DBE9E2"/>
  <text x="175" y="451" fill="#2F6C54" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">TASK INPUT</text>
  <text x="112" y="492" fill="#1F2B33" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">Implement login flow</text>
  <text x="112" y="526" fill="#59656F" font-family="Arial, sans-serif" font-size="17">Priority: REQUIRED</text>
  <text x="112" y="552" fill="#59656F" font-family="Arial, sans-serif" font-size="17">Effort: 3</text>
  <text x="112" y="580" fill="#59656F" font-family="Arial, sans-serif" font-size="14">- Return 200 for valid credentials</text>
  <text x="112" y="602" fill="#59656F" font-family="Arial, sans-serif" font-size="14">- Issue a signed session token</text>

  <rect x="386" y="408" width="510" height="204" rx="24" fill="url(#card)" stroke="#D8C3AD"/>
  <rect x="410" y="432" width="166" height="28" rx="14" fill="#DBE9E2"/>
  <text x="493" y="451" fill="#2F6C54" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">WORKFLOW SPINE</text>

  <rect x="410" y="492" width="120" height="84" rx="18" fill="#FFFFFF" fill-opacity="0.75" stroke="#D8C3AD"/>
  <rect x="426" y="508" width="58" height="22" rx="11" fill="#EFD5C8"/>
  <text x="439" y="523" fill="#7A3218" font-family="Arial, sans-serif" font-size="12" font-weight="700">PLAN</text>
  <text x="426" y="553" fill="#1F2B33" font-family="Arial, sans-serif" font-size="14" font-weight="700">Structure tasks</text>

  <text x="542" y="542" fill="#B8562F" font-family="Arial, sans-serif" font-size="30" font-weight="700">-&gt;</text>

  <rect x="560" y="492" width="120" height="84" rx="18" fill="#FFFFFF" fill-opacity="0.75" stroke="#D8C3AD"/>
  <rect x="576" y="508" width="58" height="22" rx="11" fill="#EFD5C8"/>
  <text x="589" y="523" fill="#7A3218" font-family="Arial, sans-serif" font-size="12" font-weight="700">WORK</text>
  <text x="576" y="553" fill="#1F2B33" font-family="Arial, sans-serif" font-size="14" font-weight="700">Execute clearly</text>

  <text x="692" y="542" fill="#B8562F" font-family="Arial, sans-serif" font-size="30" font-weight="700">-&gt;</text>

  <rect x="710" y="492" width="120" height="84" rx="18" fill="#FFFFFF" fill-opacity="0.75" stroke="#D8C3AD"/>
  <rect x="726" y="508" width="68" height="22" rx="11" fill="#EFD5C8"/>
  <text x="737" y="523" fill="#7A3218" font-family="Arial, sans-serif" font-size="12" font-weight="700">REVIEW</text>
  <text x="726" y="553" fill="#1F2B33" font-family="Arial, sans-serif" font-size="14" font-weight="700">Return verdicts</text>

  <rect x="928" y="408" width="248" height="204" rx="24" fill="url(#card)" stroke="#D8C3AD"/>
  <rect x="952" y="432" width="184" height="28" rx="14" fill="#DBE9E2"/>
  <text x="1044" y="451" fill="#2F6C54" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">EXECUTION RESULT</text>
  <text x="952" y="486" fill="#59656F" font-family="Arial, sans-serif" font-size="14">Mode</text>
  <text x="952" y="510" fill="#1F2B33" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">Solo</text>
  <text x="952" y="540" fill="#59656F" font-family="Arial, sans-serif" font-size="14">Task Status</text>
  <text x="952" y="564" fill="#1F2B33" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">DONE</text>
  <text x="952" y="580" fill="#59656F" font-family="Arial, sans-serif" font-size="14">Verdict</text>
  <text x="952" y="604" fill="#2F6C54" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">APPROVE</text>

  <rect x="88" y="632" width="1088" height="28" rx="14" fill="url(#terminal)"/>
  <text x="106" y="651" fill="#F1D4C4" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CLI EVIDENCE</text>
  <text x="218" y="651" fill="#F3EDE5" font-family="Consolas, 'Courier New', monospace" font-size="11">harness plan add --title "Implement login flow" --priority REQUIRED</text>
  <text x="686" y="651" fill="#F3EDE5" font-family="Consolas, 'Courier New', monospace" font-size="11">harness work solo 1</text>
  <text x="840" y="651" fill="#F3EDE5" font-family="Consolas, 'Courier New', monospace" font-size="11">harness review code src/auth.py</text>
</svg>
