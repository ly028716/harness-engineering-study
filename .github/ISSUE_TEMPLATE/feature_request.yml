name: 功能建议
description: 提出能够改善学习或使用体验的功能建议。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请说明它要解决的问题，并尽量保持建议聚焦、可讨论。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 这个建议面向哪些使用场景？当前有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的解决方案
      description: 你希望项目如何改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他可行做法、临时绕过方式或现有工具？
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可补充示例、参考链接、原型或其他背景。
